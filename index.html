<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B090A">
<title>Gosto Burritos · ERP</title>
<style>
:root{
  --negro:#0E0B0C;        /* fondo oscuro / cabecera */
  --negro-2:#171214;
  --vino:#4A0A18;        /* vinotinto principal */
  --vino-2:#681327;      /* vinotinto hover */
  --vino-prof:#2B050D;   /* vinotinto profundo */
  --oro:#C89B3C;         /* dorado */
  --oro-claro:#E8C873;
  --oro-palido:#F3E3C0;
  --crema:#FBF5EC;       /* fondo de la app */
  --papel:#FFFFFF;       /* tarjetas */
  --tinta:#2B1210;       /* texto */
  --muted:#8A7268;
  --linea:#EBDFCE;
  --linea-2:#F4EBDE;
  --ok:#2F7D4F; --ok-bg:#E3F3E9;
  --bad:#B3261E; --bad-bg:#FBE4E2;
  --sombra:0 1px 2px rgba(43,18,16,.05),0 2px 8px rgba(43,18,16,.06);
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--crema);color:var(--tinta);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
h3{margin:0 0 12px;font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--vino);display:flex;align-items:center;gap:9px}
h3::before{content:"";width:16px;height:2px;background:var(--oro);flex:0 0 auto}
code{background:var(--linea-2);padding:2px 5px;border-radius:4px;font-size:12.5px;font-family:Consolas,monospace;word-break:break-all}
.muted{color:var(--muted);font-size:14px;margin:6px 0}
.num{font-variant-numeric:tabular-nums}

/* ---------- cabecera ---------- */
header{background:var(--negro);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-bottom:3px solid var(--oro);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  border:2px solid var(--oro);box-shadow:0 0 0 3px rgba(200,155,60,.16)}
.brandtext b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;
  color:var(--oro-claro);letter-spacing:.02em;line-height:1.15}
.brandtext small{display:block;color:#B9A79C;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.sesion{display:flex;align-items:center;gap:10px}
.user{text-align:right;font-size:13px;line-height:1.25}
.user b{display:block;font-weight:600}
.user small{display:block;color:var(--oro);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em}
.ghost{background:transparent;border:1px solid rgba(200,155,60,.55);color:var(--oro-claro);border-radius:7px;
  padding:7px 12px;font-size:13px;cursor:pointer}
.ghost:hover{background:rgba(200,155,60,.14)}

/* ---------- navegación ---------- */
nav{display:flex;gap:2px;overflow-x:auto;background:var(--papel);border-bottom:1px solid var(--linea);
  position:sticky;top:61px;z-index:19;padding:0 8px}
nav:empty{display:none}
nav button{white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  padding:13px 14px 11px;font-size:14px;font-weight:600;cursor:pointer;font-family:Georgia,"Times New Roman",serif}
nav button:hover{color:var(--vino);background:#FCF8F2}
nav button.on{color:var(--vino);border-bottom-color:var(--oro)}

main{max-width:1080px;margin:0 auto;padding:16px 12px 40px}

/* ---------- tarjetas ---------- */
.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sombra)}
.card > h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}.card.span2{grid-column:1/-1}}

/* ---------- formularios ---------- */
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
label:first-of-type{margin-top:4px}
input,select{width:100%;padding:10px 12px;border:1px solid #E3D5C1;border-radius:8px;font-size:15px;background:#fff;color:var(--tinta)}
input:focus,select:focus{outline:0;border-color:var(--oro);box-shadow:0 0 0 3px rgba(200,155,60,.2)}
.btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--vino);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:Georgia,"Times New Roman",serif}
.btn:hover{background:var(--vino-2)}
.btn.sec{background:#fff;color:var(--vino);border:1px solid var(--vino)}
.btn.sec:hover{background:#FBF1F2}
.btn.gold{background:var(--oro);color:var(--vino-prof)}
.btn.gold:hover{background:var(--oro-claro)}
.btn.sm{width:auto;margin:0;padding:8px 14px;font-size:12.5px}
.msg{min-height:18px;font-size:13px;color:var(--bad);margin:10px 0 0}
.msg.ok{color:var(--ok)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

/* ---------- indicadores ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--papel);border:1px solid var(--linea);border-left:4px solid var(--oro);border-radius:var(--r);
  padding:13px 14px;box-shadow:var(--sombra)}
.k .kl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k b{display:block;font-size:21px;font-weight:700;color:var(--vino);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.k .ks{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.k.main{background:var(--vino);border-color:var(--vino);border-left-color:var(--oro)}
.k.main .kl{color:var(--oro-palido)} .k.main b{color:var(--oro-claro)} .k.main .ks{color:#D9BFC0}
.k.ok{border-left-color:var(--ok)} .k.ok b{color:var(--ok)}
.k.bad{border-left-color:var(--bad)} .k.bad b{color:var(--bad)}

/* ---------- chips de periodo ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chips button{flex:0 0 auto;background:var(--papel);border:1px solid var(--linea);color:var(--muted);border-radius:20px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.chips button:hover{border-color:var(--oro);color:var(--vino)}
.chips button.on{background:var(--vino);border-color:var(--vino);color:var(--oro-claro)}

/* ---------- gráficas ---------- */
.bar{margin:11px 0}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.bl span{color:var(--tinta);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bl b{font-variant-numeric:tabular-nums;color:var(--vino);white-space:nowrap}
.track{height:7px;border-radius:4px;background:var(--linea-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--vino),var(--oro))}
.track i.alt{background:linear-gradient(90deg,#9A7A6B,var(--oro-palido))}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--vino);
  padding:8px 10px;border-bottom:2px solid var(--oro);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--linea-2);vertical-align:middle}
table.t tbody tr:hover{background:#FDF9F4}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t tfoot td{padding:10px;font-weight:700;color:var(--vino);border-top:2px solid var(--oro);border-bottom:0;background:#FBF5EC}
.tot{font-weight:700;color:var(--vino)}
.pill{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--linea-2);color:var(--muted);white-space:nowrap}
.pill.admin{background:var(--vino);color:var(--oro-claro)}
.pill.empleado{background:var(--oro-palido);color:var(--vino)}
.pill.pendiente{background:#FAF0DC;color:#8A6100}
.pill.off{background:var(--bad-bg);color:var(--bad)}
.x{border:1px solid var(--linea);background:#fff;color:var(--bad);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.x:hover{background:var(--bad-bg);border-color:var(--bad)}
.x.n{color:var(--vino)}.x.n:hover{background:#FBF1F2;border-color:var(--vino-2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:150px;flex:0 1 auto}
.empty{color:var(--muted);font-size:14px;padding:14px;background:#FCF8F2;border:1px dashed var(--linea);border-radius:8px;text-align:center}

/* ---------- acceso ---------- */
.loginwrap{max-width:420px;margin:6vh auto 0;background:linear-gradient(160deg,var(--negro) 0%,var(--vino-prof) 100%);
  border:1px solid rgba(200,155,60,.35);border-radius:18px;padding:28px 22px 22px;box-shadow:0 20px 45px rgba(43,5,13,.35)}
.loginwrap .card{margin-bottom:0;border-radius:12px}
.logintop{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:20px;text-align:center}
.logintop b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:25px;color:var(--oro-claro);letter-spacing:.02em;line-height:1.2}
.logintop small{display:block;color:#B9A79C;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;margin-top:6px}
.logo-lg{width:118px;height:118px;border-radius:50%;object-fit:cover;border:3px solid var(--oro);box-shadow:0 0 0 5px rgba(200,155,60,.12)}

@media(max-width:520px){
  .brandtext small{display:none}
  .user b{font-size:12.5px}
}

/* ============================================================
   TEMA OSCURO — negro / vinotinto / dorado
   ============================================================ */
body{background:#0B090A;color:#EDE1D5}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#0B090A}
::-webkit-scrollbar-thumb{background:#3A2A30;border-radius:6px}
header{background:#000;border-bottom-color:var(--oro)}
.brandtext b{color:var(--oro-claro)}
.brandtext small{color:#8E7C70}
nav{background:#120E10;border-bottom-color:#2A2024}
nav button{color:#A79286}
nav button:hover{color:var(--oro-claro);background:#1A1416}
nav button.on{color:var(--oro-claro);border-bottom-color:var(--oro)}
.card{background:#171213;border-color:#2E2225}
h3{color:var(--oro-claro)}
.muted{color:#A79286}
input,select{background:#120E10;border-color:#33272A;color:#EDE1D5}
input::placeholder{color:#6E5F58}
input:focus,select:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(200,155,60,.22)}
.btn{background:linear-gradient(135deg,#6B1024,#3A0715);color:#F7E9DA;border:1px solid rgba(200,155,60,.32)}
.btn:hover{background:linear-gradient(135deg,#83142C,#4A0A18)}
.btn.sec{background:transparent;color:var(--oro-claro);border-color:var(--oro)}
.btn.sec:hover{background:rgba(200,155,60,.12)}
.btn.gold{background:var(--oro);color:#1A0E12}
.k{background:#171213;border-color:#2E2225}
.k .kl{color:#A79286}
.k b{color:var(--oro-claro)}
.k .ks{color:#A79286}
.k.main{background:linear-gradient(135deg,#4A0A18,#1E040A);border-color:#3A0715}
.k.main .kl{color:var(--oro-palido)}
.k.main .ks{color:#C3A9A6}
.chips button{background:#171213;border-color:#33272A;color:#A79286}
.chips button:hover{border-color:var(--oro);color:var(--oro-claro)}
.chips button.on{background:var(--oro);border-color:var(--oro);color:#1A0E12}
.track{background:#241B1E}
.bl span{color:#D6C6B8;opacity:1}
.bl b{color:var(--oro-claro)}
table.t th{color:var(--oro)}
table.t td{border-bottom-color:#241B1E}
table.t tbody tr:hover{background:#1D1719}
table.t tfoot td{background:#120E10;color:var(--oro-claro);border-top-color:var(--oro)}
.pill{background:#241B1E;color:#C4B3A6}
.pill.admin{background:var(--oro);color:#1A0E12}
.pill.empleado{background:#3A2A16;color:var(--oro-claro)}
.pill.pendiente{background:#3A2A16;color:#EFCB7E}
.pill.off{background:#3B1414;color:#F0A9A3}
.x{background:#171213;border-color:#33272A;color:#E08C84}
.x:hover{background:#3B1414;border-color:#E08C84}
.x.n{color:var(--oro-claro)}
.x.n:hover{background:rgba(200,155,60,.14);border-color:var(--oro)}
.empty{background:#171213;border-color:#33272A;color:#A79286}
code{background:#241B1E;color:#E4C9A6}
.loginwrap{background:linear-gradient(160deg,#000 0%,#2B050D 100%);border-color:rgba(200,155,60,.42);box-shadow:0 22px 55px rgba(0,0,0,.65)}

/* ============================================================
   BORDES GRUESOS + ANIMACIONES (acento dorado)
   ============================================================ */
@keyframes entra{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes msgin{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes brillo{0%,100%{box-shadow:0 0 0 0 rgba(200,155,60,.45)}50%{box-shadow:0 0 0 7px rgba(200,155,60,0)}}
@keyframes barraDorado{to{background-position:200% 0}}
@keyframes barra{to{width:var(--w)}}
@keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulsoLogo{0%,100%{box-shadow:0 0 0 3px rgba(200,155,60,.14),0 0 10px rgba(200,155,60,.15)}50%{box-shadow:0 0 0 5px rgba(200,155,60,.05),0 0 20px rgba(200,155,60,.45)}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/* ---------- bordes más gruesos ---------- */
header{border-bottom:4px solid var(--oro);position:sticky}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;
  background:linear-gradient(90deg,var(--oro),var(--oro-claro),var(--oro));background-size:200% 100%;
  animation:barraDorado 7s linear infinite}
nav{border-bottom:2px solid #2A2024}
.card{border:2px solid var(--linea);border-top:3px solid var(--oro);transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}
.k{border:2px solid var(--linea);border-left:5px solid var(--oro)}
.k.main{border-left-width:5px}
input,select{border-width:2px}
.btn{border-width:2px}
.btn.sec{border-width:2px}
.chips button{border-width:2px}
.x{border-width:2px}
.receta{border-width:2px}
.empty{border-width:2px}
.fotoPrev{border-width:2px}
.thumb{border-width:2px}
.filters input,.filters select{border-width:2px}
table.t th{border-bottom-width:3px}
table.t tfoot td{border-top-width:3px}
.pill{border:1px solid rgba(200,155,60,.25)}

/* ---------- animaciones de interfaz ---------- */
main.anim .card{animation:entra .45s cubic-bezier(.22,.9,.3,1) backwards}
main.anim .grid2 .card:nth-child(2){animation-delay:.07s}
main.anim .grid2 .card:nth-child(3){animation-delay:.14s}
main.anim .grid2 .card:nth-child(4){animation-delay:.21s}
main.anim .k{animation:sube .5s cubic-bezier(.22,.9,.3,1) backwards}
main.anim .k:nth-child(2){animation-delay:.06s}
main.anim .k:nth-child(3){animation-delay:.12s}
main.anim .k:nth-child(4){animation-delay:.18s}
.card:hover{transform:translateY(-3px);border-color:rgba(200,155,60,.55);box-shadow:0 12px 28px rgba(0,0,0,.5)}
.k:hover{transform:translateY(-2px);border-color:rgba(200,155,60,.5)}
.logo{animation:pulsoLogo 3.4s ease-in-out infinite}
.btn{position:relative;overflow:hidden;transition:transform .18s ease,filter .18s ease}
.btn::after{content:"";position:absolute;top:0;left:-130%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(243,227,192,.4),transparent);transform:skewX(-20deg);transition:left .65s ease}
.btn:hover::after{left:135%}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
nav button{position:relative;transition:color .25s ease,background .25s ease}
nav button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--oro),var(--oro-claro));animation:crece .45s cubic-bezier(.22,.9,.3,1)}
@keyframes crece{from{transform:scaleX(0)}to{transform:scaleX(1)}}
nav button.on{color:var(--oro-claro)}
.chips button{transition:transform .2s ease,border-color .2s ease,color .2s ease}
.chips button:hover{transform:translateY(-2px)}
.chips button.on{animation:brillo 2.6s ease-in-out infinite}
.track i{width:0;animation:barra .9s cubic-bezier(.22,.9,.3,1) forwards}
.x{transition:background .2s ease,border-color .2s ease,transform .15s ease}
.x:active{transform:scale(.93)}
.thumb{transition:transform .25s ease,border-color .25s ease}
tr:hover .thumb{transform:scale(1.12);border-color:var(--oro)}
.msg{animation:msgin .35s ease;border-left:3px solid var(--bad);padding-left:10px;border-radius:0 6px 6px 0}
.msg.ok{border-left-color:var(--ok)}
.receta{transition:border-color .28s ease,transform .28s ease}
.receta:hover{border-color:rgba(200,155,60,.5);transform:translateY(-2px)}
.receta h4{transition:color .25s ease}
.receta:hover h4{color:#FFF0C9}
table.t tbody tr{transition:background .2s ease}
.pill{transition:background .25s ease,color .25s ease}
.k.main b{animation:latido 3.4s ease-in-out infinite}
.loginwrap{border-width:2px;animation:latido 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,deleteDoc,updateDoc,onSnapshot,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   1) PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE
   Firebase Console > Project Settings (⚙) > Tus apps > Web
   Copia los 6 valores y reemplaza los de abajo.
   ============================================================ */
const firebaseConfig={
  apiKey:"TU_API_KEY",
  authDomain:"TU_PROYECTO.firebaseapp.com",
  projectId:"TU_PROYECTO",
  storageBucket:"TU_PROYECTO.appspot.com",
  messagingSenderId:"000000000000",
  appId:"TU_APP_ID"
};
/* ============================================================ */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);

/* logo de marca (se reutiliza en el acceso y en el favicon) */
const LOGO=document.querySelector('.brand .logo').src;
const fav=document.createElement('link');fav.rel='icon';fav.href=LOGO;document.head.appendChild(fav);

/* ---------- estado ---------- */
const S={user:null,rol:'',nombre:'',productos:[],gastos:[],ventas:[],usuarios:[],tab:'',r:'7',un:[]};

/* ---------- utilidades ---------- */
const money=n=>(Number(n)||0).toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
const nro=n=>(Number(n)||0).toLocaleString('es-CO');
const pct=n=>`${(Number(n)||0).toFixed(1)}%`;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoy=()=>iso(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
const msg=(id,t,ok)=>{const e=$(id);if(e){e.textContent=t;e.className='msg'+(ok?' ok':'')}};
const empty=t=>`<div class="empty">${t}</div>`;
const hora=f=>{try{return new Date(f).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
const fechaCorta=f=>{try{return new Date(f).toLocaleDateString('es-CO',{day:'2-digit',month:'short'})}catch(e){return f}};
const kpi=(l,v,s,cls='')=>`<div class="k ${cls}"><span class="kl">${l}</span><b>${v}</b>${s?`<span class="ks">${s}</span>`:''}</div>`;

const PERIODOS=[['hoy','Hoy'],['7','7 días'],['30','30 días'],['mes','Este mes'],['todo','Todo']];
const desde=()=>{
  const d=new Date();
  if(S.r==='hoy')return hoy();
  if(S.r==='7'){d.setDate(d.getDate()-6);return iso(d)}
  if(S.r==='30'){d.setDate(d.getDate()-29);return iso(d)}
  if(S.r==='mes')return hoy().slice(0,8)+'01';
  return '0000-00-00';
};
const enPeriodo=(d,ini)=>(d||'')>=ini;

const grp=(arr,k,f)=>{const m={};arr.forEach(x=>{const key=x[k]??'Sin dato';m[key]=(m[key]||0)+(Number(x[f])||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bars=(e,fmt,alt)=>{
  if(!e.length)return empty('Sin datos en este periodo.');
  const mx=Math.max(...e.map(x=>x[1]))||1;
  return e.map(([n,v])=>`<div class="bar"><div class="bl"><span title="${esc(n)}">${esc(n)}</span><b>${fmt(v)}</b></div>
    <div class="track"><i class="${alt||''}" style="width:${Math.max(3,Math.round(v/mx*100))}%"></i></div></div>`).join('');
};
const csv=(rows,name)=>{
  const txt=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const url=URL.createObjectURL(new Blob(['\uFEFF'+txt],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

/* ============================================================
   VISTAS
   ============================================================ */
const V={

/* ---------------- PANEL DEL ADMINISTRADOR ---------------- */
panel:{
  html:`<div class="chips" id="pc">${PERIODOS.map(([k,t])=>`<button data-r="${k}">${t}</button>`).join('')}</div>
        <div id="pk"></div>
        <div class="grid2" id="pg"></div>`,
  bind(){
    $('pc').onclick=e=>{const b=e.target.closest('[data-r]');if(b){S.r=b.dataset.r;V.panel.upd()}};
  },
  upd(){
    document.querySelectorAll('#pc button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.r));
    const ini=desde();
    const vs=S.ventas.filter(v=>enPeriodo(v.dia,ini));
    const gs=S.gastos.filter(g=>enPeriodo(g.fecha,ini));
    const tv=sum(vs,'total'),tg=sum(gs,'monto'),tu=sum(vs,'cantidad'),util=tv-tg;
    const ticket=vs.length?tv/vs.length:0;
    const margen=tv>0?(util/tv)*100:0;
    const topP=grp(vs,'productoNombre','cantidad')[0];
    const topE=grp(vs,'empleadoNombre','total')[0];

    $('pk').innerHTML=`<div class="kpis">
      ${kpi('Ventas',money(tv),`${nro(tu)} unidades`,'main')}
      ${kpi('Gastos',money(tg),`${nro(gs.length)} registros`)}
      ${kpi('Utilidad',money(util),`margen ${pct(margen)}`,util<0?'bad':'ok')}
      ${kpi('Ticket promedio',money(ticket),`${nro(vs.length)} ventas`)}
    </div>`;

    /* ventas por día (últimos 14 días con datos) */
    const dias=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dias.push(iso(d))}
    const porDia=dias.map(d=>[d,vs.filter(v=>v.dia===d).reduce((s,v)=>s+(Number(v.total)||0),0)]);

    /* margen por producto (ventas - costo de insumos - gastos vinculados) */
    const prod={};
    vs.forEach(v=>{const k=v.productoNombre||'Sin nombre';const p=prod[k]||(prod[k]={nombre:k,u:0,v:0});p.u+=Number(v.cantidad)||0;p.v+=Number(v.total)||0});
    const gastosProd={};
    gs.forEach(g=>{const k=g.productoNombre;if(k)gastosProd[k]=(gastosProd[k]||0)+(Number(g.monto)||0)});
    const filas=Object.values(prod).map(p=>{
      const pr=S.productos.find(x=>x.nombre===p.nombre);
      const cu=pr?(Number(pr.costo)||0):0;
      const ins=p.u*cu, gp=gastosProd[p.nombre]||0;
      return {...p,cu,ins,gp,margen:p.v-ins-gp,porc:p.v>0?((p.v-ins-gp)/p.v)*100:0};
    }).sort((a,b)=>b.v-a.v);

    $('pg').innerHTML=`
      <div class="card"><h3>Ventas por día (14 días)</h3>${bars(porDia.filter(x=>x[1]>0),money)}</div>
      <div class="card"><h3>Unidades por producto</h3>${bars(grp(vs,'productoNombre','cantidad').slice(0,8),v=>nro(v)+' u.','alt')}</div>
      <div class="card"><h3>Ventas por empleado</h3>${bars(grp(vs,'empleadoNombre','total'),money)}</div>
      <div class="card"><h3>Métodos de pago</h3>${bars(grp(vs,'metodoPago','total'),money,'alt')}</div>
      <div class="card span2"><h3>Margen por producto (ventas − costo − gastos asignados)</h3>
        ${filas.length?`<div class="tw"><table class="t"><thead><tr>
          <th>Producto</th><th class="r">Uds</th><th class="r">Ventas</th><th class="r">Costo</th><th class="r">Gastos</th><th class="r">Margen</th><th class="r">%</th></tr></thead>
          <tbody>${filas.map(f=>`<tr><td>${esc(f.nombre)}</td><td class="r">${nro(f.u)}</td><td class="r">${money(f.v)}</td>
            <td class="r">${money(f.ins)}</td><td class="r">${money(f.gp)}</td>
            <td class="r tot">${money(f.margen)}</td><td class="r">${pct(f.porc)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>Total</td><td class="r">${nro(tu)}</td><td class="r">${money(tv)}</td><td class="r">${money(sum(filas,'ins'))}</td>
            <td class="r">${money(sum(filas,'gp'))}</td><td class="r">${money(sum(filas,'margen'))}</td><td class="r"></td></tr></tfoot>
          </table></div>`:empty('Sin ventas en este periodo.')}</div>
      <div class="card"><h3>Gastos por categoría</h3>${bars(grp(gs,'categoria','monto'),money,'alt')}</div>
      <div class="card"><h3>Destacados</h3>
        ${topP?kpi('Producto top',esc(topP[0]),nro(topP[1])+' unidades'):''}
        <div style="height:8px"></div>
        ${topE?kpi('Empleado top',esc(topE[0]),money(topE[1])):''}
      </div>`;
  }
},

  empleado:[['vender','Vender'],['mi-reporte','Mi reporte']],

};
const show=t=>{
  S.tab=t;
  $('main').innerHTML=V[t].html;V[t].bind();V[t].upd();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));

const refresh=()=>{if(S.tab&&V[S.tab])V[S.tab].upd()};

$('main').onclick=async e=>{
  const d=e.target.closest('[data-del]'),g=e.target.closest('[data-tog]'),a=e.target.closest('[data-act]');
  try{
    if(d&&confirm('¿Borrar este registro? No se puede deshacer.')){
      const[c,id]=d.dataset.del.split('/');
      await deleteDoc(doc(db,c,id));
    }
    if(g){
      const p=S.productos.find(x=>x.id===g.dataset.tog);
      await updateDoc(doc(db,'productos',p.id),{activo:p.activo===false});
    }
    if(a){
      await updateDoc(doc(db,'usuarios',a.dataset.act),{activo:a.dataset.valor==='1'});
    }
  }catch(x){alert('No se pudo completar: '+x.message)}
};
document.addEventListener('change',async e=>{
  const rol=e.target.closest('[data-rol]');
  if(!rol)return;
  try{await updateDoc(doc(db,'usuarios',rol.dataset.rol),{rol:rol.value})}
  catch(x){alert('No se pudo cambiar el rol: '+x.message)}
});
$('nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b)show(b.dataset.t)};
$('out').onclick=()=>signOut(auth);

/* ---------- acceso ---------- */
const loginHtml=`<div class="loginwrap">
  <div class="logintop">
    <img class="logo-lg" src="${LOGO}" alt="Gosto Burritos">
    <span><b>Gosto Burritos</b><small>ERP de ventas y gastos</small></span>
  </div>
  <div class="card"><h3>Iniciar sesión</h3>
    <label>Correo</label><input id="le" type="email" autocomplete="username" placeholder="tucorreo@negocio.com">
    <label>Contraseña</label><input id="lp" type="password" autocomplete="current-password">
    <button class="btn" id="lb">Entrar</button><p id="lmsg" class="msg"></p>
    <p class="hint">Las cuentas las crea el administrador del negocio en Firebase Authentication.</p>
  </div></div>`;
const bindLogin=()=>{
  const go=async()=>{
    try{await signInWithEmailAndPassword(auth,$('le').value.trim(),$('lp').value)}
    catch{msg('lmsg','Correo o contraseña incorrectos.')}
  };
  $('lb').onclick=go;
  $('lp').onkeydown=e=>{if(e.key==='Enter')go()};
};

/* ---------- escucha de datos ---------- */
const mapDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const listen=()=>{
  S.un.push(onSnapshot(collection(db,'productos'),s=>{S.productos=mapDocs(s).sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||''));refresh()},err));
  const vq=S.rol==='admin'?collection(db,'ventas'):query(collection(db,'ventas'),where('empleadoId','==',S.user.uid));
  S.un.push(onSnapshot(vq,s=>{S.ventas=mapDocs(s);refresh()},err));
  if(S.rol==='admin'){
    S.un.push(onSnapshot(collection(db,'gastos'),s=>{S.gastos=mapDocs(s);refresh()},err));
    S.un.push(onSnapshot(collection(db,'usuarios'),s=>{S.usuarios=mapDocs(s);refresh()},err));
  }
};

/* ---------- autenticación ---------- */
onAuthStateChanged(auth,async u=>{
  S.un.forEach(f=>f());S.un=[];
  S.user=u;S.tab='';S.rol='';S.productos=[];S.ventas=[];S.gastos=[];S.usuarios=[];
  $('out').hidden=!u;$('who').innerHTML='';$('nav').innerHTML='';
  if(!u){$('main').innerHTML=loginHtml;bindLogin();return}
  try{
    const ref=doc(db,'usuarios',u.uid);
    let s=await getDoc(ref);
    if(!s.exists()){
      /* alta automática con permisos mínimos: rol empleado */
      await setDoc(ref,{
        nombre:(u.displayName||(u.email||'usuario').split('@')[0]),
        email:u.email||'',rol:'empleado',activo:true,creado:new Date().toISOString()
      });
      s=await getDoc(ref);
    }
    const p=s.data()||{};
    if(p.activo===false){
      $('main').innerHTML=`<div class="loginwrap"><div class="card"><h3>Cuenta desactivada</h3>
        <p class="muted">Tu usuario está inactivo. Pídeselo al administrador del negocio.</p></div></div>`;
      return;
    }
    S.rol=p.rol||'pendiente';S.nombre=p.nombre||u.email||'Usuario';
    $('who').innerHTML=`<b>${esc(S.nombre)}</b><small>${esc(S.rol)}</small>`;
    listen();
    const tabs=TABS[S.rol]||TABS.pendiente;
    if(!tabs.length){
      $('main').innerHTML=`<div class="loginwrap"><div class="card"><h3>Acceso pendiente</h3>
        <p class="muted">Tu cuenta está creada pero el administrador aún no la ha habilitado. Tu usuario es <code>${u.uid}</code>.</p></div></div>`;
      return;
    }
    $('nav').innerHTML=tabs.map(([k,t])=>`<button data-t="${k}">${t}</button>`).join('');
    show(tabs[0][0]);
  }catch(e){
    $('main').innerHTML=`<div class="loginwrap"><div class="card"><h3>No se pudo cargar tu perfil</h3>
      <p class="muted">${esc(e.message)}</p>
      <p class="hint">Si las reglas de Firestore no están publicadas, ejecuta <code>firebase deploy --only firestore:rules</code>.</p></div></div>`;
  }
});
</script>
</body>
</html>
